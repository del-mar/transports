<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Frete</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h2>Calculadora de Frete</h2>
        <label>Origem:</label>
        <input type="text" id="origem" autocomplete="off" list="sugestoes-origem">
        <datalist id="sugestoes-origem">
            <option value="Lisboa">
            <option value="Oeiras">
            <option value="Amadora">
            <option value="Parque das Nações">
        </datalist>

        <label>Destino:</label>
        <input type="text" id="destino" autocomplete="off" list="sugestoes-destino">
        <datalist id="sugestoes-destino">
            <option value="Lisboa">
            <option value="Oeiras">
            <option value="Amadora">
            <option value="Parque das Nações">
            <option value="Odivelas">
        </datalist>

        <label>Distância (km):</label>
        <input type="number" id="distancia" max="200" min="0" step="1" required>

        <label>Horas de Serviço:</label>
        <input type="number" id="horas" max="7" min="0" step="1" required>

        <label>Precisa de Ajudante?</label>
        <select id="ajudante">
            <option value="nao">Não</option>
            <option value="sim">Sim</option>
        </select>

        <button onclick="calcularFrete()">Calcular Frete</button>

        <h3>Valor do Frete: <span id="resultado">-</span> €</h3>
        <h3>IVA (23%): <span id="iva">-</span> €</h3>
        <h3>Valor Total: <span id="total">-</span> €</h3>

        <p class="error" id="erro"></p>
        <h3 class="contact-info" id="contact-message" style="display: none;">
            LIGUE AGORA! +351925073455
        </h3>
    </div>

    <script>
         function abrirWhatsApp() {
            var numero = "351920514152"; 
            var mensagem = "Olá, acabei de obter um orçamento pelo vosso site, gostaria de saber qual a disponibilidade para executar o serviço."; // Mensagem pré-escrita
            var url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensagem);
            window.open(url, "_blank");
    }
    </script>
</head>
<body>
    <buttona onclick="abrirWhatsApp()">Fale conosco no WhatsApp</button>
</body>
</html>

    <script src="https://del-mar.github.io/transports/SCRIPT.JS"></script>
</body>

</html>
